name: Engineering quality gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-quality.txt
            requirements-dev.txt
            app/requirements-core.txt
            src/companion_runtime/connectors/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development checks and lightweight test dependencies
        run: python -m pip install -r requirements-quality.txt -r requirements-dev.txt -r app/requirements-core.txt -r src/companion_runtime/connectors/requirements.txt
      - name: Run lint, types, architecture mutations and regressions
        run: python scripts/quality_gate.py --full
      - name: Preserve machine-readable check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-quality-evidence
          path: |
            review/quality-gate.json
            review/quality-gate-logs/
            review/character-regression.json
          if-no-files-found: warn
          retention-days: 7

  formal-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned TLC release for model checking
        run: |
          mkdir -p .build/formal-tools
          curl --fail --location --retry 3 --output .build/formal-tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Verify tool hash, safe models and expected counterexamples
        run: python review/formal-models/run_models.py --jar .build/formal-tools/tla2tools.jar --output .build/formal-evidence/report.json
      - name: Preserve model-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-model-evidence
          path: |
            .build/formal-evidence/report.json
            review/formal-models/logs/
          if-no-files-found: error
          retention-days: 7
