<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播室设置</title><link rel="stylesheet" href="/room.css"><body>
<div class="workspace-header"><h1>直播室</h1><span>本地预览</span><button id="clear-scene" disabled>清空画面文字</button><button id="fullscreen-preview">全屏预览</button><button id="show-controls" hidden>显示设置</button><a href="/">返回助手</a></div>
<div class="workspace"><section class="preview-column" aria-label="预览"><div class="preview-heading"><span id="applied-mode">专注</span><span id="settings-state" role="status"></span></div><div id="preview-shell"><main id="room" data-mode="focus">
<header><span id="room-state" hidden></span></header><section class="page-space"><div class="paper-rule" hidden></div><p id="topic" hidden></p><div id="focus-widget" hidden><span class="widget-label">剩余时间</span><output id="clock"></output><span id="timer-state"></span></div><section id="question-widget" hidden><span class="widget-label">提问</span><p id="question"></p></section><section id="break-widget" hidden><output id="break-status"></output></section><p id="caption" hidden></p></section>
<section class="character-space" aria-label="Live2D角色"><img id="character-image" alt="当前角色" hidden><div id="character-canvas"></div><p id="character-status" role="status">正在读取角色</p></section>
</main></div><p id="issue" role="alert"></p></section>
<aside id="controls" aria-label="直播室设置"><div class="control-heading"><h2>设置</h2><button id="hide-controls">收起</button></div><fieldset id="room-settings" disabled><div class="apply-bar"><button id="apply-settings">应用</button></div><nav aria-label="场景"><button data-mode="focus" aria-pressed="true">专注</button><button data-mode="question" aria-pressed="false">提问</button><button data-mode="break" aria-pressed="false">休息</button></nav><details id="design-settings" open><summary>人物与布置</summary><label>预览人物<select id="character-select"></select></label><div class="catalog-actions"><a href="/#characters" target="_blank" rel="noopener" id="manage-characters">管理人物</a><button type="button" id="refresh-characters">刷新人物</button></div><label>人物位置<select id="layout-select"><option value="right">右侧</option><option value="left">左侧</option><option value="small">右下小窗</option></select></label><label>配色<select id="theme-select"><option value="carbon">炭黑 · 杏橙</option><option value="midnight">午夜蓝 · 冰蓝</option><option value="daylight">冷白 · 墨蓝</option></select></label><div class="widget-toggles"><label><input type="checkbox" id="show-topic" checked>主题</label><label><input type="checkbox" id="show-question" checked>提问</label><label><input type="checkbox" id="show-caption" checked>字幕</label><label><input type="checkbox" id="show-timer" checked>计时</label></div><div class="saved-designs"><label>已存布置<select id="design-select"><option value="">未选择</option></select></label><div class="actions"><button id="load-design" type="button">载入</button><button id="delete-design" type="button">删除</button></div><label>布置名称<input id="design-name" maxlength="40"></label><button id="save-design" type="button">保存布置</button><p id="design-status" role="status"></p></div></details><label>主题<input id="topic-input" maxlength="100"></label><label>提问<textarea id="question-input" maxlength="220"></textarea></label><label>字幕<textarea id="caption-input" maxlength="300"></textarea></label><section class="timer-settings"><h3>专注计时</h3><label>时长<select id="duration"><option value="15">15分钟</option><option value="25" selected>25分钟</option><option value="50">50分钟</option></select></label><div class="actions"><button id="timer-toggle">开始</button><button id="timer-reset">重置</button></div></section><section class="timer-settings"><h3>休息计时</h3><label>时长<select id="break-duration"><option value="3">3分钟</option><option value="5" selected>5分钟</option><option value="10">10分钟</option></select></label><div class="actions"><button id="break-toggle">开始</button><button id="break-reset">重置</button></div></section></fieldset></aside></div>
<script src="/room-design.js"></script><script src="/study-session.js"></script><script src="/scene-controller.js"></script><script src="/room.js"></script></body></html>
