<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播室设置</title><link rel="stylesheet" href="/room.css"><body>
<div class="workspace-header"><h1>直播室</h1><span>本地预览</span><button id="clear-scene" disabled>清空画面文字</button><button id="fullscreen-preview">全屏预览</button><button id="show-controls" hidden>显示设置</button><a href="/">返回助手</a></div>
<div class="workspace"><section class="preview-column" aria-label="预览"><div class="preview-heading"><span id="applied-mode">专注</span><span id="settings-state" role="status"></span></div><div id="preview-shell"><main id="room" data-mode="focus">
<header><span id="room-state" hidden></span></header><section class="page-space"><div class="paper-rule" hidden></div><p id="topic" hidden></p><div id="focus-widget" hidden><span class="widget-label">剩余时间</span><output id="clock"></output><span id="timer-state"></span></div><section id="question-widget" hidden><span class="widget-label">提问</span><p id="question"></p></section><section id="break-widget" hidden><output id="break-status"></output></section><p id="caption" hidden></p></section>
<section class="character-space" aria-label="Live2D角色"><img id="character-image" alt="当前角色" hidden><div id="character-canvas"></div><p id="character-status" role="status">正在读取角色</p></section>
</main></div><p id="issue" role="alert"></p></section>
<aside id="controls" aria-label="直播室设置"><div class="control-heading"><h2>设置</h2><button id="hide-controls">收起</button></div><fieldset id="room-settings" disabled><nav aria-label="场景"><button data-mode="focus" aria-pressed="true">专注</button><button data-mode="question" aria-pressed="false">提问</button><button data-mode="break" aria-pressed="false">休息</button></nav><label>主题<input id="topic-input" maxlength="100"></label><label>提问<textarea id="question-input" maxlength="220"></textarea></label><label>字幕<textarea id="caption-input" maxlength="300"></textarea></label><button id="apply-settings">应用</button><section class="timer-settings"><h3>专注计时</h3><label>时长<select id="duration"><option value="15">15分钟</option><option value="25" selected>25分钟</option><option value="50">50分钟</option></select></label><div class="actions"><button id="timer-toggle">开始</button><button id="timer-reset">重置</button></div></section><section class="timer-settings"><h3>休息计时</h3><label>时长<select id="break-duration"><option value="3">3分钟</option><option value="5" selected>5分钟</option><option value="10">10分钟</option></select></label><div class="actions"><button id="break-toggle">开始</button><button id="break-reset">重置</button></div></section></fieldset></aside></div>
<script src="/study-session.js"></script><script src="/scene-controller.js"></script><script src="/room.js"></script></body></html>
