<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>窗边 · 本地场景</title><link rel="stylesheet" href="/room.css"><body>
<main id="room" data-mode="focus">
 <header><span class="local-mark">本地样稿</span><span id="room-state">专注</span></header>
 <section class="page-space"><div class="paper-rule"></div><p id="topic">本场主题尚未填写</p><div id="focus-widget"><span class="widget-label">本轮剩余</span><output id="clock">25:00</output><span id="timer-state">未开始</span></div><section id="question-widget" hidden><span class="widget-label">当前提问</span><p id="question">尚未置顶提问</p></section><section id="break-widget" hidden><p>稍后继续</p><span id="break-status">尚未开始休息计时</span></section><p id="caption" hidden></p></section>
 <section class="character-space" aria-label="Live2D角色"><img id="character-image" alt="当前角色" hidden><div id="character-canvas"></div><p id="character-status" role="status">正在读取角色</p></section>
 <footer><span id="scene-note">仅显示本页手动选择的内容</span><button id="show-controls">场景设置</button></footer>
</main>
<aside id="controls" aria-label="场景设置"><div class="control-heading"><h1>场景设置</h1><button id="hide-controls">收起</button></div><nav aria-label="场景"><button data-mode="focus" aria-pressed="true">专注</button><button data-mode="question" aria-pressed="false">提问</button><button data-mode="break" aria-pressed="false">休息</button></nav><label>本场主题<input id="topic-input" maxlength="100" placeholder="填写你正在讲的内容"></label><button id="apply-topic">显示主题</button><label>置顶提问<textarea id="question-input" maxlength="220" placeholder="粘贴允许展示的观众问题"></textarea></label><button id="apply-question">显示提问</button><label>字幕<textarea id="caption-input" maxlength="300" placeholder="本地样稿使用手动字幕"></textarea></label><button id="apply-caption">显示字幕</button><label>专注时长<select id="duration"><option value="15">15分钟</option><option value="25" selected>25分钟</option><option value="50">50分钟</option></select></label><div class="actions"><button id="timer-toggle">开始专注</button><button id="timer-reset">重置计时</button></div><label>休息时长<select id="break-duration"><option value="3">3分钟</option><option value="5" selected>5分钟</option><option value="10">10分钟</option></select></label><button id="break-toggle">开始休息</button><p id="issue" role="alert"></p><a href="/">返回助手</a></aside>
<script src="/study-session.js"></script><script src="/scene-controller.js"></script><script src="/room.js"></script></body></html>
