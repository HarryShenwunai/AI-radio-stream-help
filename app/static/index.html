<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小岚 · 陪你慢慢聊</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside class="rail"><a class="brand" href="/" aria-label="小岚首页">岚<span>LAN</span></a><nav aria-label="主导航"><button class="nav active" data-view="chat" title="聊天">♡<span>聊天</span></button><button class="nav" data-view="memory" title="记忆">✧<span>记忆</span></button><button class="nav" data-view="tasks" title="约定">◷<span>约定</span></button></nav><button class="nav settings-nav" data-view="settings">⚙<span>设置</span></button></aside>
<main class="shell">
<section class="portrait" aria-label="小岚的房间"><div class="portrait-top"><span></span><span class="local-tag">仅本机</span></div><div class="illustration"><div class="halo"></div><img src="/avatar.svg" alt="原创插画：短发、浅色毛衣的二次元女孩"><span class="spark spark-one">✧</span><span class="spark spark-two">✦</span></div><div class="portrait-bottom"><h1><span id="portrait-name">小岚</span>，在这里。</h1><p id="portrait-line">今天的你，是什么心情？</p><div class="room-controls"><button id="voice-toggle" class="pill" aria-pressed="true">♪ 语音开启</button><button id="stop-voice" class="pill">停止朗读</button></div></div></section>
<section class="workspace">
<header class="topbar"><div><h2 id="view-title">和小岚聊天</h2><p class="connection" id="connection">正在连接…</p></div><div class="top-actions"><button id="export" class="icon-button" title="导出聊天与记忆" aria-label="导出聊天与记忆">↓</button><button id="clear-chat" class="icon-button" title="清空对话" aria-label="清空对话">↺</button></div></header>
<section id="view-chat" class="view chat-view"><div class="conversation-toolbar"><div class="modes" role="group" aria-label="相处方式"><button type="button" data-mode="daily" aria-pressed="true">随便聊</button><button type="button" data-mode="listen" aria-pressed="false">听我说</button><button type="button" data-mode="playful" aria-pressed="false">轻松一点</button></div><button type="button" id="memory-toggle" class="context-toggle" aria-pressed="true" title="按需使用长期记忆；点击只聊当下">记忆按需</button><button type="button" id="mobile-voice" class="context-toggle" aria-label="切换语音朗读" aria-pressed="true">♪</button></div><div id="messages" class="messages" aria-live="polite"><div class="day-divider">我们的对话</div></div><div id="thinking" class="thinking" hidden><i></i><i></i><i></i><span>小岚正在想…</span><button type="button" id="stop-generation">停止</button></div><div id="error" class="error" role="alert" hidden></div><button type="button" id="retry-answer" class="retry-answer" hidden>重新回答</button><form id="composer" class="composer"><textarea id="message-input" rows="1" maxlength="1200" placeholder="想说什么，都可以…" aria-label="消息"></textarea><div class="composer-bottom"><button type="button" id="mic" class="icon-button" title="语音输入" aria-label="语音输入">🎙</button><span>Enter 发送 · Shift + Enter 换行</span><button type="submit" id="send" class="send-button" aria-label="发送消息">↑</button></div></form></section>
<section id="view-memory" class="view content-view" hidden><div class="section-heading"><h3>记得你的事</h3><span id="memory-count"></span></div><form id="memory-form" class="inline-form"><input id="memory-input" maxlength="300" placeholder="希望我记住什么？" aria-label="新增记忆"><button class="primary" type="submit">记住</button></form><p class="hint">也可以在聊天里说「记住：……」。只在相关时参考，闲聊不用翻旧事。选择模型 API 时，相关内容会发送到该服务。</p><div id="memory-list" class="card-list"></div></section>
<section id="view-tasks" class="view content-view" hidden><div class="section-heading"><h3>我们的小约定</h3><span id="task-count"></span></div><form id="task-form" class="task-form"><label>做点什么<input id="task-title" maxlength="100" placeholder="比如：一起读 20 页书" required></label><div class="form-row"><label>多久后提醒<select id="task-minutes"><option value="1">1 分钟</option><option value="5">5 分钟</option><option value="25" selected>25 分钟</option><option value="60">1 小时</option><option value="1440">明天这个时间</option></select></label><label>约定类型<select id="task-kind"><option value="reminder">普通约定</option><option value="study">学习约定</option></select></label></div><button class="primary" type="submit">约好了</button></form><p class="hint" id="task-hint">应用运行时会在这里提醒。尚未接入微信。</p><div id="task-list" class="card-list"></div></section>
<section id="view-settings" class="view content-view" hidden><form id="settings-form" class="settings-form"><div class="section-heading"><h3>你喜欢的她</h3></div><div class="form-row"><label>名字<input name="name" maxlength="30"></label><label>怎样称呼你<input name="user_name" maxlength="30"></label></div><label>性格与相处方式<textarea name="personality" rows="3" maxlength="1200"></textarea></label><label>她自己的小偏好<textarea name="character_notes" rows="2" maxlength="1200"></textarea></label><label>长期记忆<select name="memory_mode"><option value="relevant">按需参考 · 每轮最多 3 条</option><option value="off">只聊当下 · 不读取长期记忆</option></select></label><div class="section-heading"><h3>聊天模型</h3></div><label>运行方式<select name="engine" id="engine"><option value="local">本地模型 · 不上传聊天</option><option value="api">模型 API · 发送必要聊天上下文</option></select></label><div id="local-model-note" class="notice"></div><div id="api-fields" hidden><label>API 地址<input name="api_base" placeholder="https://api.example.com/v1"></label><label>模型名称<input name="api_model" placeholder="模型提供方给出的名称"></label><label>API 密钥<input name="api_key" type="password" autocomplete="new-password" placeholder="留空保留现有密钥"></label><p class="hint">连接 API 后，必要的聊天与记忆会发送到你选择的服务。密钥单独保存在本机。</p></div><div class="section-heading"><h3>相处节奏</h3></div><label class="switch-row"><span>偶尔主动找你聊天<small>两小时没有消息后，每天最多两次</small></span><input name="proactive" type="checkbox"></label><label class="switch-row"><span>开启督学<small>允许创建学习约定，关闭后暂停未完成学习任务</small></span><input name="study" type="checkbox"></label><div class="form-row"><label>安静开始<select name="quiet_start" id="quiet-start"></select></label><label>安静结束<select name="quiet_end" id="quiet-end"></select></label></div><p class="hint" id="timezone"></p><label>朗读语速<input name="voice_rate" type="range" min="0.6" max="1.5" step="0.1"></label><label>浏览器音色<select id="voice-select"><option value="">自动选择中文音色</option></select></label><button class="secondary" type="button" id="test-voice">试听声音</button><button class="secondary" type="button" id="notify-permission">开启浏览器提醒</button><button type="submit" class="primary save">保存设置</button><button type="button" class="secondary" id="restore-backup">恢复备份</button><input type="file" id="backup-file" accept="application/json,.json" hidden></form><div class="app-note">小岚 v0.2 · 角色为虚构 AI。当前提供本机聊天和提醒，微信未接入。电脑休眠或应用关闭时无法提醒。</div></section>
</section>
</main><div id="toast" class="toast" role="status" hidden></div>
</body></html>
