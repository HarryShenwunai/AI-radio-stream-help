<main id="scene-screen" class="companion-scene">
 <header class="scene-header"><button id="identity-picker" type="button" class="identity-picker" aria-label="切换或创建角色"><span class="identity-mark"><svg class="icon" aria-hidden="true"><use href="#i-person"></use></svg></span><span id="identity-name">正在连接</span><svg class="icon chevron" aria-hidden="true"><use href="#i-chevron"></use></svg></button><div class="header-actions"><button id="open-studio" class="button studio-entry" type="button"><svg class="icon" aria-hidden="true"><use href="#i-person"></use></svg><span>角色工作室</span></button><button id="theme-switch" class="button icon-button" type="button" aria-label="切换夜间显示" title="切换夜间显示"><svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg></button></div></header>
 <section class="portrait" id="character-scene" aria-label="角色场景"><div class="scene-light" aria-hidden="true"></div><div class="illustration"><img id="character-image" alt="当前角色形象" hidden><div id="character-canvas" class="character-canvas" hidden></div><div id="appearance-placeholder" class="appearance-placeholder"><svg class="placeholder-outline" aria-hidden="true" viewBox="0 0 240 400"><path d="M76 119c-9-24-4-58 10-72 13-14 51-16 67 2 15 17 17 45 9 69l-15 27 9 35 27 11 29 137M77 121l15 25-10 34-29 12-25 136M82 181l16 40-14 118m72-158-16 40 14 118M94 146c13 8 30 9 52 0M85 339h69"/></svg><span class="sr-only">尚未启用角色形象</span><button id="placeholder-import" class="button" type="button">导入你的角色</button></div></div><div id="scene-status" class="scene-status" role="status" hidden></div><button id="scene-retry" class="button scene-retry" type="button" hidden>重试显示</button></section>
 <section class="interaction-area" aria-label="交流"><div id="current-reply" class="current-reply" hidden><p id="current-reply-text"></p><button id="reply-read" type="button" class="button icon-button" aria-label="朗读这条回复" title="朗读这条回复"><svg class="icon" aria-hidden="true"><use href="#i-volume"></use></svg></button></div><div class="interaction-meta"><button id="conversation-connection" class="connection-pill" type="button"><span class="connection-dot" aria-hidden="true"></span><span id="connection-state">连接中</span></button><span id="media-state" role="status"></span><button id="stop-speaking" class="button quiet-stop" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-stop"></use></svg><span>停止朗读</span></button></div>
 <form id="compose-form" class="compose-capsule"><button id="open-history" class="button icon-button" type="button" aria-label="对话回看" title="对话回看"><svg class="icon" aria-hidden="true"><use href="#i-chat"></use></svg></button><label class="sr-only" for="compose-text">想对她说的话</label><textarea id="compose-text" rows="1" maxlength="4000" placeholder="想聊些什么？" enterkeyhint="send"></textarea><button id="cancel-recording" class="button icon-button" type="button" aria-label="取消语音输入" title="取消语音输入" hidden><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button><button id="record-input" class="button icon-button" type="button" aria-label="语音输入" title="语音输入"><svg class="icon" aria-hidden="true"><use href="#i-mic"></use></svg></button><button id="send-message" class="button send-button" type="submit" aria-label="发送" title="发送"><svg class="icon" aria-hidden="true"><use href="#i-send"></use></svg></button><button id="stop-answer" class="button send-button" type="button" aria-label="停止回复" title="停止回复" hidden><svg class="icon" aria-hidden="true"><use href="#i-stop"></use></svg></button></form>
 <div class="scene-bottom"><button id="open-possibilities" class="button scene-tool" type="button"><svg class="icon" aria-hidden="true"><use href="#i-spark"></use></svg><span>一起做点什么</span></button><span id="draft-status" class="draft-status" role="status"></span><button id="open-companion-controls" class="button scene-tool" type="button" aria-label="陪伴选项"><svg class="icon" aria-hidden="true"><use href="#i-more"></use></svg><span>相处方式</span></button></div><p id="conversation-error" class="conversation-error" role="alert" hidden></p><button id="retry-answer" class="button retry-button" type="button" hidden>重试这次回复</button>
 </section></main><div id="experience-root" class="experience-root" hidden></div><div id="toast" class="toast" role="status" hidden></div></body></html>
