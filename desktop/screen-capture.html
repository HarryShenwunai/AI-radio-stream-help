<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>屏幕本机预览</title>
<link rel="stylesheet" href="screen-capture.css"><script defer src="screen-capture-view.js"></script></head>
<body><header><h1>屏幕本机预览</h1><span id="state" role="status">尚未采集</span></header>

<footer><button id="start">开始预览</button><button id="stop" disabled>停止</button><p>此窗口只在本机显示。回到主窗口确认后，才发送当前帧。</p></footer></body></html>
